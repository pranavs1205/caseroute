services:
  graph:
    image: falkordb/falkordb:latest
    command: ["redis-server", "--loadmodule", "/var/lib/falkordb/bin/falkordb.so", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
      - "127.0.0.1:3001:3000"
    volumes:
      - graph-data:/var/lib/falkordb/data
    restart: unless-stopped
volumes:
  graph-data:
